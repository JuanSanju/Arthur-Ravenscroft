<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arthur Ravenscroft</title>
  <style>
    :root {
      /* Modo Noche (por defecto) */
      --bg-color: #0b0f19;          /* Fondo oscuro profundo */
      --text-color: #f8fafc;        /* Texto claro */
      --title-color: #38bdf8;       /* Azul cielo para el título */
      --nav-bg: #1e293b;            /* Navbar pizarra distintiva que resalta */
      --nav-border: #334155;        /* Borde divisorio visible */
      --nav-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      --btn-bg: #334155;            /* Fondo del botón */
      --btn-hover: #475569;
      --btn-border: #475569;
      --card-bg: #1e293b;           /* Fondo de tarjetas */
      --card-border: #334155;       /* Borde para contenedores */
      --img-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      --quote-color: #cbd5e1;       /* Color de la frase en modo noche */
    }

    /* Modo Mañana (Claro) */
    body.modo-manana {
      --bg-color: #f1f5f9;          /* Fondo suave claro */
      --text-color: #0f172a;        /* Texto oscuro */
      --title-color: #0284c7;       /* Azul diurno para el título */
      --nav-bg: #ffffff;            /* Navbar blanco puro para contraste claro */
      --nav-border: #cbd5e1;        /* Borde gris definido */
      --nav-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      --btn-bg: #e2e8f0;            /* Fondo del botón claro */
      --btn-hover: #cbd5e1;
      --btn-border: #cbd5e1;
      --card-bg: #ffffff;
      --card-border: #cbd5e1;
      --img-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      --quote-color: #475569;       /* Color de la frase en modo mañana */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Navbar superior con colores distintivos */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2.5rem;
      background-color: var(--nav-bg);
      border-bottom: 2px solid var(--nav-border);
      box-shadow: var(--nav-shadow);
      position: sticky;
      top: 0;
      transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .navbar h1 {
      color: var(--title-color);
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0;
      transition: color 0.3s ease;
    }

    /* Botón circular sin texto (solo ícono) */
    .theme-btn {
      width: 44px;
      height: 44px;
      background-color: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      transition: transform 0.2s ease, background-color 0.25s ease, border-color 0.25s ease;
    }

    .theme-btn:hover {
      background-color: var(--btn-hover);
      transform: scale(1.1);
    }

    .theme-btn:active {
      transform: scale(0.95);
    }

    /* Contenido principal */
    .content {
      padding: 2.5rem;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Distribución de la ficha */
    .profile-layout {
      display: flex;
      gap: 2.5rem;
      align-items: flex-start;
    }

    /* Columna izquierda: Imagen de perfil */
    .profile-sidebar {
      flex: 0 0 300px;
      width: 300px;
    }

    .profile-image-card {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--img-shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-image-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
      aspect-ratio: 3 / 4;
    }

    /* Frase del personaje */
    .character-quote {
      margin-top: 1.25rem;
      padding: 1rem 1.2rem;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--title-color);
      border-radius: 6px 14px 14px 6px;
      font-style: italic;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--quote-color);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      text-align: center;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    }

    /* Columna derecha: Detalles de la ficha */
    .profile-details {
      flex: 1;
      min-width: 0;
    }

    /* Responsividad */
    @media (max-width: 768px) {
      .navbar {
        padding: 1rem 1.5rem;
      }

      .content {
        padding: 1.5rem;
      }

      .profile-layout {
        flex-direction: column;
        align-items: center;
      }

      .profile-sidebar {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>
<body>

  <!-- Barra de navegación superior -->
  <nav class="navbar">
    <h1>Arthur Ravenscroft</h1>
    <button id="theme-btn" class="theme-btn" title="Modo Mañana" aria-label="Cambiar tema">☀️</button>
  </nav>

  <!-- Contenedor para el contenido de la página -->
  <main class="content">
    <div class="profile-layout">
      <!-- Columna izquierda: Imagen y frase de Arthur -->
      <aside class="profile-sidebar">
        <div class="profile-image-card">
          <img src="Arthur.jfif" alt="Arthur Ravenscroft">
        </div>
        <blockquote class="character-quote">
          “Mientras más conocimiento obtengo, más profundo y temible se vuelve mi miedo a lo desconocido.”
        </blockquote>
      </aside>

      <!-- Columna derecha: Detalles de la ficha -->
      <section class="profile-details">
        <!-- Aquí puedes seguir agregando contenido a tu página -->
      </section>
    </div>
  </main>

  <script>
    const themeBtn = document.getElementById('theme-btn');

    themeBtn.addEventListener('click', () => {
      // Alterna la clase 'modo-manana' en el body
      document.body.classList.toggle('modo-manana');

      // Actualiza solo el ícono y tooltip según el modo
      if (document.body.classList.contains('modo-manana')) {
        themeBtn.textContent = '🌙';
        themeBtn.title = 'Modo Noche';
        themeBtn.setAttribute('aria-label', 'Modo Noche');
      } else {
        themeBtn.textContent = '☀️';
        themeBtn.title = 'Modo Mañana';
        themeBtn.setAttribute('aria-label', 'Modo Mañana');
      }
    });
  </script>

</body>
</html>
