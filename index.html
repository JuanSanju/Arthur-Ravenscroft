<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arthur Ravenscroft</title>
  <style>
    :root {
      /* Modo Noche (por defecto) */
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --title-color: #38bdf8;
      --nav-bg: rgba(15, 23, 42, 0.95);
      --nav-border: #1e293b;
      --btn-bg: #1e293b;
      --btn-text: #f8fafc;
      --btn-border: #334155;
      --btn-hover: #334155;
    }

    /* Modo Mañana (Claro) */
    body.modo-manana {
      --bg-color: #f8fafc;
      --text-color: #0f172a;
      --title-color: #0284c7;
      --nav-bg: rgba(255, 255, 255, 0.95);
      --nav-border: #e2e8f0;
      --btn-bg: #f1f5f9;
      --btn-text: #0f172a;
      --btn-border: #cbd5e1;
      --btn-hover: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Navbar superior */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2.5rem;
      background-color: var(--nav-bg);
      border-bottom: 1px solid var(--nav-border);
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .navbar h1 {
      color: var(--title-color);
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0;
      transition: color 0.3s ease;
    }

    /* Botón Modo Mañana / Modo Noche */
    .theme-btn {
      background-color: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .theme-btn:hover {
      background-color: var(--btn-hover);
      transform: translateY(-1px);
    }

    .theme-btn:active {
      transform: translateY(0);
    }

    /* Contenido principal */
    .content {
      padding: 2.5rem;
    }
  </style>
</head>
<body>

  <!-- Barra de navegación superior -->
  <nav class="navbar">
    <h1>Arthur Ravenscroft</h1>
    <button id="theme-btn" class="theme-btn">☀️ Modo Mañana</button>
  </nav>

  <!-- Contenedor para el contenido de la página -->
  <main class="content">
    <!-- Aquí puedes seguir agregando contenido a tu página -->
  </main>

  <script>
    const themeBtn = document.getElementById('theme-btn');

    themeBtn.addEventListener('click', () => {
      // Alterna la clase 'modo-manana' en el body
      document.body.classList.toggle('modo-manana');

      // Actualiza el texto e ícono del botón
      if (document.body.classList.contains('modo-manana')) {
        themeBtn.textContent = '🌙 Modo Noche';
      } else {
        themeBtn.textContent = '☀️ Modo Mañana';
      }
    });
  </script>

</body>
</html>
